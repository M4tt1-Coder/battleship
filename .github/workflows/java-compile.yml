name: Java - Maven Package Lifecycle

permissions:
  contents: read # access to check out code and install dependencies

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  JAVA_VERSION: 17.0.17

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: action/checkout@v5
      - name: Setup Java
        uses: action/setup-java@v5
        with:
          distribution: "openjdk"
          java-version: ${{ JAVA_VERSION }}
          check-latest: true
          cache: "maven"
      - run: ./mvnw clean package
